<style>
/* Worn medieval: weathered parchment, dark wood, brass and faded red over a pixel-art world.
   The game is one full-screen canvas; these screens float over it. */
:root {
  --night: #15181d; --parch: #e6d9b8; --parch-2: #cdb98e; --ink: #2c2117; --ink-soft: #5b4733;
  --wood: #5a4330; --wood-d: #2a1e15; --brass: #b08d4f; --brass-d: #6f5630; --red: #7a2e27; --red-d: #4f1c18;
  --f-title: "Jacquarda Bastarda 9", "Pixelify Sans", Georgia, serif;
  --f-ui: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--night); overflow: hidden; overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#game { z-index: 0; }
#fx { z-index: 30; pointer-events: none; }
#safe-probe { position: fixed; left: 0; top: 0; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.screen { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(6px, 2.4vh, 14px); box-sizing: border-box; text-align: center; font-family: var(--f-ui); color: var(--ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-bottom, 0px)); }
.screen.dim { background: rgba(12, 10, 8, .55); -webkit-backdrop-filter: blur(1.5px); backdrop-filter: blur(1.5px); }
button { touch-action: manipulation; font-family: var(--f-ui); }

/* title: a weathered signboard hanging on two chains */
.sign { position: relative; padding: clamp(6px, 2.2vh, 13px) clamp(22px, 5vw, 46px) clamp(9px, 2.8vh, 16px);
  background: linear-gradient(#5e4632, #3d2c1f); border: 3px solid #1b130d; border-radius: 6px;
  box-shadow: inset 0 0 0 2px rgba(176, 141, 79, .55), inset 0 3px 0 rgba(255, 230, 180, .12), 0 10px 26px rgba(0, 0, 0, .55); }
.sign::before, .sign::after { content: ""; position: absolute; bottom: 100%; width: 4px; height: 60vh;
  background: repeating-linear-gradient(#7a6038 0 5px, #33261a 5px 8px); }
.sign::before { left: 18%; } .sign::after { right: 18%; }
.title { margin: 0; font-family: var(--f-title); font-weight: 400; font-size: clamp(40px, 15vh, 92px); line-height: .95; color: #e9d7a9;
  text-shadow: 0 3px 0 #1a120c, 0 6px 14px rgba(0, 0, 0, .55); text-wrap: balance; }
.tagline { margin: 0; font-size: clamp(12px, 3.6vh, 17px); color: #e6d9b8; letter-spacing: .06em; font-weight: 600;
  background: rgba(18, 13, 9, .62); border: 1px solid rgba(176, 141, 79, .45); padding: .15em .9em; border-radius: 3px; }

/* buttons */
.btn { appearance: none; cursor: pointer; font-weight: 700; color: var(--ink); background: linear-gradient(#e3d4ae, #c3ab7e);
  border: 3px solid #21170f; border-radius: 6px; box-shadow: inset 0 0 0 2px rgba(255, 248, 230, .25), inset 0 -3px 0 rgba(90, 60, 30, .25), 0 4px 0 #160f0a, 0 8px 14px rgba(0, 0, 0, .35);
  padding: .36em 1.5em .42em; font-size: clamp(16px, 5.4vh, 26px); letter-spacing: .04em; text-shadow: 0 1px 0 rgba(255, 250, 236, .35); transition: transform .08s; }
.btn:active { transform: translateY(3px); box-shadow: inset 0 0 0 2px rgba(255, 248, 230, .25), 0 1px 0 #160f0a; }
.btn.big { font-size: clamp(22px, 8vh, 36px); padding: .26em 2.3em .34em; color: #f0e2c2; background: linear-gradient(#8a372e, #62241e); border-color: #1c100c;
  box-shadow: inset 0 0 0 2px #a8864c, inset 0 3px 0 rgba(255, 200, 160, .15), 0 5px 0 #140a07, 0 10px 18px rgba(0, 0, 0, .45); text-shadow: 0 2px 0 #2a0f0b; animation: bob 2.2s ease-in-out infinite; }
.btn.big:active { box-shadow: inset 0 0 0 2px #a8864c, 0 1px 0 #140a07; }
.btn.wood { background: linear-gradient(#6e5139, #4a3626); color: #ead9b4; border-color: #1a120c; box-shadow: inset 0 0 0 2px rgba(176, 141, 79, .45), 0 4px 0 #100a07, 0 8px 14px rgba(0, 0, 0, .35); text-shadow: 0 1px 0 #1a120c; }
.btn.leaf { background: linear-gradient(#6c7a4c, #4c5734); color: #f0e8cf; border-color: #1b1f12; box-shadow: inset 0 0 0 2px rgba(206, 194, 132, .35), 0 4px 0 #11140a, 0 8px 14px rgba(0, 0, 0, .35); text-shadow: 0 1px 0 #1b1f12; }
.btn.small { font-size: clamp(13px, 4.2vh, 18px); padding: .3em 1.1em; }
.chip { appearance: none; cursor: pointer; font-weight: 600; font-size: clamp(12px, 3.6vh, 16px); color: #e6d6b0; background: rgba(28, 21, 15, .84);
  border: 2px solid #8f7240; border-radius: 4px; padding: .3em .9em; box-shadow: 0 3px 0 #0e0906; }
.chip[aria-pressed="false"] { opacity: .6; }
.btn:focus-visible, .chip:focus-visible, .card:focus-visible { outline: 3px solid #e9d7a9; outline-offset: 3px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

/* level select: parchment banners hanging from dark wooden rods */
.ribbon { position: relative; z-index: 0; margin: 0; display: inline-block; background: linear-gradient(#83332b, #5e231d); color: #efe3c8; font-family: var(--f-title);
  font-weight: 400; font-size: clamp(22px, 7.5vh, 40px); line-height: 1.15; padding: .04em 1.2em .12em; border-radius: 2px;
  box-shadow: inset 0 2px 0 #a8864c, inset 0 -2px 0 #a8864c, 0 4px 0 #2a0f0b, 0 8px 16px rgba(0, 0, 0, .45); text-shadow: 0 2px 0 #2a0f0b;
  clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 50%, 100% 100%, 0 100%, 12px 50%); }
.cards { display: flex; gap: clamp(12px, 2.6vw, 24px); justify-content: center; align-items: flex-start; padding-top: 8px; }
.card { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; position: relative; width: clamp(118px, 23vw, 196px); color: var(--ink);
  filter: drop-shadow(2px 0 0 #1e1510) drop-shadow(-2px 0 0 #1e1510) drop-shadow(0 2px 0 #1e1510) drop-shadow(0 -2px 0 #1e1510) drop-shadow(0 8px 6px rgba(0, 0, 0, .45));
  transition: transform .12s; }
.card::before { content: ""; position: absolute; left: -10px; right: -10px; top: -7px; height: 9px; border-radius: 3px; background: linear-gradient(#6e5139, #33251a); z-index: 2;
  box-shadow: inset 7px 0 0 #a8864c, inset -7px 0 0 #a8864c; }
.card:active { transform: translateY(2px); }
.banner { display: flex; flex-direction: column; align-items: center; gap: clamp(2px, .8vh, 6px);
  padding: clamp(8px, 2vh, 12px) 10px clamp(20px, 6vh, 32px); background: radial-gradient(ellipse at 50% 40%, #e9ddbe 40%, #cdb88c 100%);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - clamp(14px, 4vh, 22px)), 0 100%); }
.card .num { font-family: var(--f-title); font-size: clamp(28px, 10vh, 52px); line-height: .9; color: #6a2820; }
.card .scene { width: 100%; height: clamp(26px, 10vh, 56px); border-radius: 2px; background-size: cover; background-position: center 70%;
  image-rendering: pixelated; box-shadow: inset 0 0 0 2px rgba(30, 21, 16, .75), 0 1px 0 rgba(255, 248, 230, .4); }
.sc-forest { background-color: #8d9a96; background-image: linear-gradient(#9fa9a6 0 55%, #4f5d52 55% 78%, #4e4032 78%); }
.sc-village { background-color: #c59a74; background-image: linear-gradient(#a98a7f, #dfb684 55%, #a68b52 55% 78%, #86715a 78%); }
.sc-keep { background-color: #222b3a; background-image: linear-gradient(#1a2130, #2e3848 55%, #474b54 55% 78%, #56595f 78%); }
.card .lname { font-weight: 700; font-size: clamp(12px, 4vh, 18px); }
.diff { font-size: clamp(11px, 3.2vh, 14px); font-weight: 700; color: #f0e6cc; padding: .08em .7em; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25); }
.easy .diff { background: #5d6a44; } .med .diff { background: #8f6f34; } .hard .diff { background: #84352b; }
.stars { display: flex; gap: 3px; }
.stars i, .big-stars i { display: block; aspect-ratio: 1; background: #5a4d3d; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.stars i { width: clamp(12px, 4vh, 18px); }
.stars i.on { background: #c9a24e; }
.card.locked { cursor: not-allowed; }
.card.locked .banner { filter: grayscale(.85) brightness(.8); }
.lock { position: absolute; top: 42%; left: 50%; width: 22px; height: 16px; margin-left: -11px; background: #3a3532; border-radius: 3px; box-shadow: inset 0 0 0 2px #1c1816, inset 0 3px 0 #5a534e; }
.lock::before { content: ""; position: absolute; left: 3px; top: -11px; width: 10px; height: 10px; border: 3px solid #2a2624; border-bottom: 0; border-radius: 8px 8px 0 0; }
.purse { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: clamp(14px, 4.4vh, 20px); color: #e6d6b0; background: rgba(28, 21, 15, .84);
  border: 2px solid #8f7240; border-radius: 4px; padding: .15em .8em; font-variant-numeric: tabular-nums; }
i.coin { display: inline-block; width: .9em; height: .9em; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f0d890 0 16%, #cfa64e 20% 60%, #7d5e26 64%); vertical-align: -.1em; }

/* parchment scroll panels (pause, results) */
.scroll { position: relative; background: radial-gradient(ellipse at 50% 35%, #ebdfc0 35%, #d2bd91 100%); border: 2px solid #5b4128; border-radius: 4px;
  padding: clamp(12px, 3.4vh, 20px) clamp(20px, 5vw, 40px); display: flex; flex-direction: column; align-items: center; gap: clamp(5px, 1.8vh, 10px);
  max-width: min(520px, 100%); max-height: calc(100% - 20px); box-sizing: border-box; box-shadow: inset 0 0 18px rgba(110, 72, 30, .35), 0 12px 32px rgba(0, 0, 0, .55); }
.scroll::before, .scroll::after { content: ""; position: absolute; left: -14px; right: -14px; height: 14px; border-radius: 6px;
  background: linear-gradient(#6b4f36, #2e2016); border: 2px solid #1a120c; box-shadow: inset 9px 0 0 #9c7c46, inset -9px 0 0 #9c7c46; }
.scroll::before { top: -10px; } .scroll::after { bottom: -10px; }
.panel-title { margin: 0; font-family: var(--f-title); font-weight: 400; font-size: clamp(28px, 10vh, 52px); line-height: 1; color: #5e241d; text-wrap: balance; }
.seal { position: absolute; top: -14px; right: -8px; width: clamp(26px, 8vh, 40px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 38% 35%, #b4544a, #7a2a24 62%, #5a1d19); box-shadow: 0 2px 0 #3a1210, inset 0 0 0 3px rgba(60, 14, 12, .35); }
.msg { margin: 0; min-height: 2.7em; max-width: 34ch; font-size: clamp(13px, 4vh, 18px); line-height: 1.35; color: var(--ink); }
.big-stars { display: flex; gap: 10px; }
.big-stars i { width: clamp(26px, 9vh, 44px); transform: scale(.7); transition: transform .35s cubic-bezier(.3, 1.7, .5, 1), background .2s; }
.big-stars i.on { background: #c9a24e; transform: scale(1); }
.goals { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: clamp(11px, 3.2vh, 14px); color: var(--ink-soft); }
.goals span::before { content: ""; display: inline-block; width: .7em; height: .7em; margin-right: .35em; border-radius: 1px; border: 2px solid #8a7458; vertical-align: -.05em; }
.goals span.ok { color: #46532f; font-weight: 700; }
.goals span.ok::before { background: #5d6a44; border-color: #3d4630; }
.stats { display: flex; gap: 18px; font-weight: 700; font-size: clamp(13px, 4vh, 18px); font-variant-numeric: tabular-nums; }
.stats:empty { display: none; }

/* coin shop: a merchant's parchment list beside a framed view of the knight and Kitty */
.btn.brass { background: linear-gradient(#d2b066, #8f6f34); color: #2a1d10; border-color: #21170f; text-shadow: 0 1px 0 rgba(255, 240, 200, .4);
  box-shadow: inset 0 0 0 2px rgba(255, 240, 200, .35), 0 4px 0 #160f0a, 0 8px 14px rgba(0, 0, 0, .35); }
.shop { display: flex; gap: clamp(14px, 3vw, 30px); align-items: center; justify-content: center; width: min(940px, 100%); height: 100%; }
.shop-side { flex: none; display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 2vh, 12px); }
.shop-view { position: static; width: clamp(150px, 30vw, 240px); height: auto; aspect-ratio: 11 / 6; image-rendering: pixelated; border-radius: 4px;
  background: radial-gradient(ellipse at 50% 85%, #55634d, #1f2620 75%); border: 3px solid #1a120c; box-shadow: inset 0 0 0 2px #a8864c, 0 6px 14px rgba(0, 0, 0, .45); }
.shop-list { flex: 1 1 auto; align-self: stretch; margin-block: 14px; padding: 6px 6px 8px 14px; max-width: 620px; }
.shop-note { margin: 0; min-height: 1.3em; font-size: clamp(12px, 3.6vh, 15px); font-weight: 700; color: var(--red); }
.shop-items { align-self: stretch; flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-right: 6px; text-align: left; touch-action: pan-y; }
.shop-items h3 { margin: 6px 0 4px; font-family: var(--f-title); font-weight: 400; font-size: clamp(20px, 6.5vh, 28px); line-height: 1; color: #5e241d; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.item { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 3px; padding: 5px 4px 6px; border-radius: 4px; text-align: center;
  background: rgba(255, 248, 230, .32); border: 2px solid rgba(91, 65, 40, .55); font-size: clamp(11px, 3.4vh, 14px); font-weight: 700; color: var(--ink); }
.item.on { border-color: #5d6a44; background: rgba(196, 210, 150, .35); }
.item small { font-weight: 600; font-size: .9em; color: var(--ink-soft); }
.pic { height: 56px; display: flex; align-items: center; } .pic img { image-rendering: pixelated; } .x1 { height: 56px; } .x2 { height: 52px; } .x3 { height: 42px; }
.ibtn { appearance: none; cursor: pointer; font-family: var(--f-ui); font-weight: 700; font-size: clamp(11px, 3.4vh, 14px); color: #f0e8cf; padding: .15em .7em; border-radius: 4px;
  border: 2px solid #1b1f12; background: linear-gradient(#6c7a4c, #4c5734); box-shadow: 0 2px 0 #11140a; white-space: nowrap; }
.ibtn.buy { color: #2a1d10; border-color: #21170f; background: linear-gradient(#d9b866, #9a7838); box-shadow: 0 2px 0 #160f0a; }
.ibtn:disabled { cursor: default; color: #46532f; background: none; border-color: transparent; box-shadow: none; }
.ibtn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
.ibtn:focus-visible { outline: 3px solid #e9d7a9; outline-offset: 2px; }

/* world map: the lands drawn on old parchment (the canvas is painted by the game) */
.map { position: static; inset: auto; width: min(92vw, calc((100dvh - 150px) * 2.5), 720px); height: auto; aspect-ratio: 5 / 2; cursor: pointer; image-rendering: pixelated;
  border: 3px solid #5b4128; border-radius: 4px; box-shadow: inset 0 0 0 2px rgba(176, 141, 79, .5), 0 10px 26px rgba(0, 0, 0, .5); touch-action: manipulation; }

/* trophies: brass medals with illuminated initials, and a parchment toast when one is earned */
.troph-list { width: min(760px, 100%); flex: 0 1 auto; min-height: 0; margin-block: 10px; padding-block: 8px; }
.troph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.troph { display: flex; align-items: center; gap: 8px; text-align: left; padding: 5px 6px; border-radius: 4px; background: rgba(255, 248, 230, .32); border: 2px solid rgba(91, 65, 40, .55); }
.troph.off { opacity: .72; }
.troph b { display: block; font-size: clamp(12px, 3.6vh, 15px); }
.troph small { display: block; font-size: clamp(11px, 3.2vh, 13px); color: var(--ink-soft); font-weight: 600; }
.medal { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-title); font-size: 22px; line-height: 1; color: #5e241d;
  background: radial-gradient(circle at 35% 30%, #f6e2a0 0 14%, #d4b05a 40%, #8f6f34 75%); border: 2px solid #3a2a1e; box-shadow: inset 0 0 0 2px rgba(255, 240, 200, .35), 0 2px 0 #1a120c; }
.medal.off { color: #4f4a43; background: radial-gradient(circle at 35% 30%, #aba59a, #7d776c 60%, #575249); }
.toast { position: fixed; z-index: 35; top: max(56px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 8px;
  padding: 6px 14px 6px 8px; font-family: var(--f-ui); color: var(--ink); text-align: left; pointer-events: none; animation: toastIn .35s ease-out;
  background: radial-gradient(ellipse at 50% 35%, #ebdfc0 35%, #d2bd91 100%); border: 2px solid #5b4128; border-radius: 4px; box-shadow: inset 0 0 10px rgba(110, 72, 30, .3), 0 6px 16px rgba(0, 0, 0, .5); }
.toast small { display: block; font-size: 11px; font-weight: 700; color: var(--red); letter-spacing: .04em; }
.toast b { display: block; font-size: 15px; }
@keyframes toastIn { from { transform: translateY(-14px); opacity: 0; } }

/* turn-your-phone overlay */
#rotate { z-index: 40; background: linear-gradient(#1b2232, #3c3a44); }
#rotate .tagline { color: #e6d9b8; }
.phone { width: 46px; height: 78px; border: 4px solid #e6d9b8; border-radius: 10px; position: relative; animation: turn 2.2s ease-in-out infinite; }
.phone::after { content: ""; position: absolute; bottom: 5px; left: 50%; width: 10px; height: 3px; margin-left: -5px; border-radius: 2px; background: #e6d9b8; }
@keyframes turn { 0%, 20% { transform: rotate(0); } 50%, 80% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
@media (prefers-reduced-motion: reduce) { .phone, .btn.big { animation: none; } }
</style>

<canvas id="game" aria-label="Knight's Path game"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="safe-probe" aria-hidden="true"></div>

<section id="scr-title" class="screen" data-screen>
  <div class="sign"><h1 class="title">Knight's Path</h1></div>
  <p class="tagline">Three lands. Three foes. One brave knight.</p>
  <button id="btn-start" class="btn big" type="button">Start</button>
  <div class="row">
    <button id="tg-music" class="chip" type="button" aria-pressed="true">Music: On</button>
    <button id="tg-sfx" class="chip" type="button" aria-pressed="true">Sound: On</button>
  </div>
</section>

<section id="scr-levels" class="screen" data-screen hidden>
  <h2 class="ribbon">Choose your quest</h2>
  <canvas id="map" class="map" width="600" height="240" role="img" aria-label="Map of the lands"></canvas>
  <div class="row">
    <button id="btn-back" class="btn wood small" type="button">Back</button>
    <span class="purse" aria-label="Coins"><i class="coin"></i><span id="coin-total">0</span></span>
    <button id="btn-shop" class="btn brass small" type="button">Shop</button>
    <button id="btn-troph" class="btn brass small" type="button">Trophies</button>
    <button id="btn-story" class="btn brass small" type="button">Story</button>
    <button id="btn-begin" class="btn big small" type="button">Begin</button>
  </div>
</section>

<section id="scr-troph" class="screen" data-screen hidden>
  <h2 class="ribbon">Trophies</h2>
  <div class="scroll troph-list">
    <p id="troph-count" class="shop-note"></p>
    <div id="troph-items" class="shop-items"></div>
  </div>
  <button id="troph-back" class="btn wood small" type="button">Back</button>
</section>

<div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toast-medal" class="medal" aria-hidden="true"></span><span><small>Trophy earned</small><b id="toast-name"></b></span></div>

<section id="scr-shop" class="screen" data-screen hidden>
  <div class="shop">
    <div class="shop-side">

function buildTheme(name) {

  th.name = name; th.skyCv = genSky(th); th.starCv = th.stars ? genStars(th) : null; th.cloudL = th.clouds ? genClouds(th) : null;

  return th;
}

/* ---------- animated props ---------- */
function drawMill(b, x, y, r) {
  const a = T * 0.55;
  for (let k = 0; k < 4; k++) {
    spr(b, x, y, 1, { rot: a + (k * Math.PI) / 2 });
    line(0, 0, r, 0, '#4a3828');
    poly([r * 0.24, 1, r, 1, r, 6, r * 0.24, 5], '#c9bc9b');
    line(r * 0.24, 3, r, 3, '#9a8c6e');
    for (let i = 0; i < 4; i++) { const u = r * (0.24 + i * 0.25); line(u, 1, u, 5, '#7b6a52'); }
  }
  spr(b, x, y, 1); disc(0.5, 0.5, 2.2, '#3a2c20'); dot(0, 0, '#6b5640');
}
function drawTorch(b, x, y) {
  spr(b, x, y, 1);
  const f = Math.floor(T * 11 + x * 0.37), h = 4 + ((hash(f) * 3) | 0), sw = hash(f + 1) < 0.33 ? -1 : hash(f + 1) > 0.66 ? 1 : 0;
  rect(-1, 0, 3, 2, '#3a2e22');
  rect(-1, -h, 3, h, '#a8482a'); dot(sw, -h - 1, '#a8482a'); dot(sw, -h - 2, '#c86a32');
  rect(0, -h + 1, 1, h - 1, '#e08c3c'); dot(sw, -h, '#e08c3c'); rect(0, -2, 1, 2, '#f4d27a');
  for (let i = 0; i < 2; i++) { const age = (T * 0.9 + i * 0.5 + x * 0.013) % 1; if (age < 0.75) dot(Math.round(Math.sin(age * 9 + i) * 2), -6 - Math.round(age * 16), age < 0.4 ? '#f0b060' : '#a85a34'); }
  light(x + 0.5, y - 3, 30 + hash(f) * 5, '#ffaa5a', 0.42);
}
function drawSmoke(b, x, y) {
  for (let i = 0; i < 6; i++) {
    const a = (T * 0.22 + i / 6) % 1, px = x + a * 12 + Math.sin(a * 6 + i) * 2, py = y - a * 28;
    b.globalAlpha = (1 - a) * 0.4; spr(b, px, py, 1); disc(0, 0, 1 + a * 3, '#b9ac9a');
  }
  b.globalAlpha = 1;
}
function drawProp(b, p, x, y) { if (p.type === 'mill') drawMill(b, x, y, p.r); else if (p.type === 'torch') drawTorch(b, x, y); else drawSmoke(b, x, y); }

/* ---------- drawing a land into the buffer ---------- */
function drawLayer(b, L, camX, Y, W, M) {
  const P = L.P, off = Math.floor(camX * L.f + T * L.drift) - M, x0 = -(((off % P) + P) % P), y = L.y0 - Y;
  for (let x = x0; x < W; x += P) b.drawImage(L.cv, x, y);
  if (L.props) for (let x = x0 - P; x < W + P; x += P) for (const p of L.props) { const px = x + p.x; if (px > -40 && px < W + 40) drawProp(b, p, px, p.y - Y); }
}
function drawCelestial(b, th, x, y) {
  const S = th.cel;
  const g = b.createRadialGradient(x, y, S.r * 0.6, x, y, S.hr);
  g.addColorStop(0, rgba(S.halo, S.ha)); g.addColorStop(0.5, rgba(S.halo, S.ha * 0.3)); g.addColorStop(1, rgba(S.halo, 0));
  b.fillStyle = g; b.fillRect(x - S.hr, y - S.hr, S.hr * 2, S.hr * 2);
  spr(b, x, y, 1);
  disc(0, 0, S.r + 1, S.rim); disc(-0.5, -0.5, S.r, S.col);
  if (S.moon && !S.cut) { disc(-4, -3, 3, S.rim); disc(4, 3, 2.4, S.rim); disc(-1, 6, 1.6, S.rim); dot(6, -5, S.rim); }
  if (S.cut) disc(3.5, -2.5, S.r, S.cut);
}
function drawSceneBack(b, th, camX) {
  const W = WB.w, M = WB.M, Y = VIEW_Y0 - M;
  for (let x = 0; x < W; x += th.skyCv.width) b.drawImage(th.skyCv, x, SKY_Y0 - Y);
  if (th.starCv) {
    const P = th.starCv.width, off = Math.floor(camX * 0.02);
    for (let x = -(((off % P) + P) % P); x < W; x += P) b.drawImage(th.starCv, x, SKY_Y0 - Y);
    for (let i = 0; i < 7; i++) { const a = Math.sin(T * 1.7 + i * 2.1); if (a < 0.55) continue; const x = Math.round(hash(i * 3.1) * W), y = Math.round(SKY_Y0 + Math.pow(hash(i * 7.7), 1.6) * 130 - Y); b.fillStyle = '#f3f0e4'; b.fillRect(x, y, 1, 1); b.fillStyle = 'rgba(200,208,224,.6)'; b.fillRect(x - 1, y, 3, 1); b.fillRect(x, y - 1, 1, 3); }
  }
  drawCelestial(b, th, Math.round(M + (W - 2 * M) * th.cel.x), Math.round(th.cel.y - Y));
  if (th.cloudL) drawLayer(b, th.cloudL, camX, Y, W, M);

}
function drawSceneFront(b, th, camX, amb) {
  const Y = VIEW_Y0 - WB.M;
  if (amb) drawAmbient(b, amb, Y, th);
  drawLayer(b, th.foreL, camX, Y, WB.w, WB.M);
}
/* gentle vignette on the main canvas (hi-res) */
function vignette(c, a) {
  if (!a) return;
  const g = c.createRadialGradient(VW / 2, H * 0.55, H * 0.35, VW / 2, H * 0.55, Math.max(VW, H) * 0.75);
  g.addColorStop(0, 'rgba(10,8,12,0)'); g.addColorStop(1, 'rgba(10,8,12,' + a + ')');
  c.fillStyle = g; c.fillRect(0, 0, VW, H);
}

/* ---------- ambient life: leaves, mist motes, fireflies, snow (never butterflies) ---------- */
function ambNew(kind, anywhere) {
  const W = WB.w || 640, p = { kind, x: rand(-8, W + 8), y: 0, ph: rand(0, 20), d: rand(0.55, 1.15), v: Math.random() };
  if (kind === 'leaf' || kind === 'snow') p.y = anywhere ? rand(VIEW_Y0 - 10, GROUND) : VIEW_Y0 - rand(6, 40);
  else if (kind === 'firefly') p.y = rand(190, GROUND - 6);
  else p.y = rand(160, GROUND - 4);
  return p;
}
function makeAmbient(th) { const a = []; for (const [k, n] of th.amb) for (let i = 0; i < n; i++) a.push(ambNew(k, true)); return a; }
function updateAmbient(list, dt, dcam) {
  const W = WB.w || 640;
  for (let i = 0; i < list.length; i++) {
    const p = list[i]; p.ph += dt; p.x -= dcam * p.d;
    if (p.kind === 'leaf') { p.y += (13 + p.v * 12) * p.d * dt; p.x += (Math.sin(p.ph * 1.7 + p.v * 6) * 18 + 7) * dt; }
    else if (p.kind === 'snow') { p.y += (12 + p.v * 16) * p.d * dt; p.x += (Math.sin(p.ph * 1.3 + p.v * 6) * 6 + 4) * dt; }
    else if (p.kind === 'firefly') { p.x += Math.sin(p.ph * 0.9 + p.v * 9) * 11 * dt; p.y += Math.cos(p.ph * 1.3 + p.v * 5) * 8 * dt; }
    else { p.x += (3 + Math.sin(p.ph * 0.5 + p.v * 4) * 4) * dt; p.y += Math.sin(p.ph * 0.8 + p.v * 7) * 2 * dt; }
    if (p.x < -12) p.x += W + 24; else if (p.x > W + 12) p.x -= W + 24;
    if (p.kind === 'leaf' || p.kind === 'snow') { if (p.y > GROUND + 3) list[i] = ambNew(p.kind, false); }
    else p.y = clamp(p.y, 150, GROUND - 2);
  }
}
function drawAmbient(b, list, Y, th) {
  for (const p of list) {
    const x = Math.round(p.x), y = Math.round(p.y - Y);
    if (p.kind === 'leaf') {
      const fl = Math.sin(p.ph * 5 + p.v * 9); b.fillStyle = th.leaf[(p.v * th.leaf.length) | 0];
      if (fl > 0.3) b.fillRect(x, y, 2, 1); else if (fl < -0.3) b.fillRect(x, y, 1, 2); else { b.fillRect(x, y, 1, 1); b.fillRect(x + 1, y + 1, 1, 1); }
    } else if (p.kind === 'snow') { const big = p.d > 1.02; b.fillStyle = big ? 'rgba(232,236,242,.95)' : 'rgba(200,208,222,.75)'; b.fillRect(x, y, big ? 2 : 1, big ? 2 : 1); }
    else if (p.kind === 'firefly') {
      const a = 0.5 + 0.5 * Math.sin(p.ph * 2.6 + p.v * 10); if (a < 0.2) continue;
      b.fillStyle = rgba('#f2e9a8', 0.45 + a * 0.55); b.fillRect(x, y, 1, 1); light(x + 0.5, y + 0.5, 5 + a * 4, '#dcd88e', 0.32 * a);
    } else { const a = 0.22 + 0.28 * Math.sin(p.ph * 1.5 + p.v * 8); if (a <= 0.06) continue; b.fillStyle = rgba(th.mote, a); b.fillRect(x, y, 1, 1); }
  }
}

/* ---------- little scene thumbnails for the level cards ---------- */
function themeThumb(name) {
  const th = buildTheme(name);
  if (th.thumb != null) return th.thumb;
  const W = 300, Hh = 96, Y = name === 'keep' ? 170 : 204, cv = mkCanvas(W, Hh), b = cv.getContext('2d');
  for (let x = 0; x < W; x += th.skyCv.width) b.drawImage(th.skyCv, x, SKY_Y0 - Y);
  drawCelestial(b, th, Math.round(W * (th.cel.x + 0.1)), clamp(th.cel.y - Y, 16, 60));
  if (th.cloudL) drawLayer(b, th.cloudL, 140, Y, W, 0);
  for (const L of th.L) drawLayer(b, L, 140, Y, W, 0);
  drawLayer(b, th.groundL, 140, Y, W, 0);
  LIGHTS.length = 0;
  try { th.thumb = cv.toDataURL(); } catch (e) { th.thumb = ''; }
  return th.thumb;
}

/* ---------- level flow ---------- */

  switch (G.phase) {
    case 'intro':

      if (t > 0.6 && !G.flags.pet) { G.flags.pet = true; startPet(); }
      if (G.flags.pet && !G.pet && G.cut) { G.cut = false; if (G.li === 0 && !save.tutorial) { save.tutorial = true; persist(); say('tutorial'); } }
      if (t > (G.cat ? 3.5 : 2.2)) startWave(0);
      break;
    case 'checkpoint': {   // continuing after a defeat: no intro, straight back into the wave or the boss fight
      const cp = G.cp;
      if (!G.flags.hello) { G.flags.hello = true; G.cut = false; say(cp.boss ? 'checkpointBoss' : 'checkpoint', { w: cp.wave + 1 }); }
      if (!cp.boss) { if (t > 0.5) startWave(cp.wave); }

      if (!G.queue.length && alive === 0) { G.phase = 'waveClear'; G.phaseT = 0; sfx('waveClear'); say('waveClear'); supplies(); }
      break;
    }
    case 'waveClear': if (t > 3.0) { if (G.waveIdx + 1 < L.waves.length) startWave(G.waveIdx + 1); else startBoss(); } break;
    case 'boss': {
      const b = G.boss;

  const report = (err) => { if (!loopErr) { loopErr = true; console.error(err); } };

}

  } catch (err) { report(err); }

  window.addEventListener('keydown', (e) => { if (state !== 'levels') return; if (e.code === 'ArrowLeft') mapGo(MapS.sel - 1); else if (e.code === 'ArrowRight') mapGo(MapS.sel + 1); });
  $('troph-back').addEventListener('click', closeShop);
  cvs.addEventListener('pointerdown', () => { if (state === 'story' && Story.t > 0.25) endStory(); });
  window.addEventListener('keydown', () => { if (state === 'story' && Story.t > 0.25) endStory(); });
  $('shop-items').addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) shopAct(b.dataset.act); });
  $('btn-resume').addEventListener('click', () => { sfx('ui'); resumeGame(); });
  $('btn-restart').addEventListener('click', () => { sfx('ui'); const i = G ? G.li : 0; cloudTransition(() => startLevel(i), { quick: true }); });
  $('btn-quit').addEventListener('click', () => { sfx('ui'); cloudTransition(goLevels, { quick: true }); });
  $('res-levels').addEventListener('click', () => { sfx('ui'); cloudTransition(goLevels, { quick: true }); });
  for (const id of ['tg-music', 'tg-music2']) $(id).addEventListener('click', () => { sfx('init'); if (!sfx('setMusic', !save.music)) { save.music = !save.music; persist(); } sfx('ui'); syncToggles(); });
  for (const id of ['tg-sfx', 'tg-sfx2']) $(id).addEventListener('click', () => { sfx('init'); if (!sfx('setSfx', !save.sfx)) { save.sfx = !save.sfx; persist(); } sfx('ui'); syncToggles(); });
  showScreen('scr-title');
  requestAnimationFrame(frame);
  ['forest', 'village', 'keep'].forEach((n, i) => setTimeout(() => { try { buildTheme(n); } catch (e) { console.error(e); } }, 600 + i * 350));   // paint the lands while the title shows
  if (window.KP_TEST || /test/.test(location.hash)) window.KP = { startLevel, startBoss, startWave, get G() { return G; }, get state() { return state; }, save, Snd, Input, tick: testTick, openShop, shopAct, drinkPotion: () => G && drinkPotion(G.hero), openTrophies, award, startStory, Story };
}
boot();

})();
</script>
</body></html>
